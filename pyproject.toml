[project]
name = "ws26-guide"
version = "0.1.0"
description = "Web Summit 2026 side-event guide: plan API, leads, email and Telegram delivery"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "aiogram>=3.13", "pydantic>=2", "anthropic>=0.70"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ws26 = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
