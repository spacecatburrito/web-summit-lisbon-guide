<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; display: grid; grid-template-columns: 640px 560px; background: #fff; color: #000; font-family: "Schibsted Grotesk", Arial, sans-serif; }
  .text { padding: 56px 48px 48px 64px; display: flex; flex-direction: column; }
  .strip { font: 400 20px/1.3 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .02em; }
  h1 { margin-top: 44px; font-weight: 500; font-size: 76px; line-height: .98; letter-spacing: -.035em; }
  h1 span { display: block; margin-top: 18px; font-weight: 700; background: #ffd21f; padding: 4px 14px 10px; width: fit-content; }
  .foot { margin-top: auto; font-size: 22px; line-height: 1.3; }
  .foot b { display: block; font-weight: 700; font-size: 34px; letter-spacing: -.01em; }
  .photo { position: relative; background: url("../public/img/praca-do-comercio.jpg") 38% 70% / cover; }
  .credit { position: absolute; left: 12px; bottom: 10px; right: 12px; color: #fff; font: 400 13px/1.3 Arial, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
</style></head>
<body>
  <div class="text">
    <p class="strip">Web Summit Lisbon 2026 | Unofficial guide</p>
    <h1>Make the most of your Web Summit,<span>and have fun</span></h1>
    <p class="foot"><b>tss.wtf/ws</b>Side events, sessions for you, Lisbon hacks</p>
  </div>
  <div class="photo"><p class="credit">Photo: Harry Murphy / Web Summit via Sportsfile, CC BY 2.0</p></div>
</body></html>
